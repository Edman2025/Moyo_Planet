name: Release Check

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run release:check

      - name: Verify Docker image build
        run: npm run verify:docker-build

      - name: Verify Docker runtime
        run: npm run verify:docker-runtime
